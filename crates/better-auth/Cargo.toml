[package]
name = "better-auth"
version = "0.1.0"
description = "Framework-neutral runtime foundation for Better Auth in Rust"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["axum", "sqlite"]
axum = ["dep:axum"]
sqlite = ["dep:rusqlite"]
sqlx = ["dep:sqlx"]
libsql = ["dep:libsql", "dep:secrecy"]
saml = ["dep:saml-rs"]

[dependencies]
aes-gcm.workspace = true
axum = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
better-auth-core = { path = "../better-auth-core" }
data-encoding.workspace = true
reqwest.workspace = true
rusqlite = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
saml-rs = { workspace = true, optional = true }
tokio.workspace = true
hmac.workspace = true
http.workspace = true
jsonwebtoken.workspace = true
libsql = { workspace = true, optional = true }
password-hash.workspace = true
secrecy = { workspace = true, optional = true }
sha1.workspace = true
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
webauthn-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[example]]
name = "client-test-server"
required-features = ["axum"]

[[example]]
name = "web-example"
required-features = ["axum"]
