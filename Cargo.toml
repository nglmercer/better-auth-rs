[workspace]
resolver = "2"
members = [
    "crates/better-auth-core",
    "crates/better-auth",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.11.1"
axum = "0.8"
async-trait = "0.1"
base64 = "0.23.1"
data-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "form", "rustls"] }
rusqlite = "0.43"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "any", "postgres", "mysql"] }
saml-rs = "0.8"
tokio = { version = "1", features = ["rt", "time"] }
hmac = "0.13"
http = "1"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = "0.12"
rsa = { version = "0.10", features = ["encoding"] }
libsql = "0.10"
password-hash = { version = "0.6.1", features = ["phc", "getrandom"] }
secrecy = "0.10"
sha1 = "0.11"
scrypt = { version = "0.12", features = ["phc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
subtle = "2"
getrandom = "0.4.3"
thiserror = "2"
tracing = "0.1"
url = "2.5.9"
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }
uuid = { version = "1.29.3", features = ["v4", "v5", "serde"] }
# SMTP over TLS. Defaults are off so the ring provider is the only one compiled in.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
crypto-glue = { git = "https://github.com/nglmercer/crypto-glue", rev = "eb80ef9adfee042c68939e79665e160649a1cc4b" }
