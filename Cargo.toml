[workspace]
resolver = "2"
members = [
    "crates/better-auth-core",
    "crates/better-auth",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10"
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
data-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rusqlite = "0.32"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql"] }
saml-rs = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
hmac = "0.12"
http = "1"
jsonwebtoken = "9"
libsql = "0.9"
password-hash = "0.5"
secrecy = "0.10"
sha1 = "0.10"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = "2"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
